# Data product brief 4 Bagian 3.4. Kontrak dbt dan rekaman DCAT dibangkitkan dari berkas ini:
#   python3 -m sdg_gudang.gudang.kontrak
nama: dp_lingkungan_provinsi
jenis: pilar
domain: lingkungan
judul: Nilai pilihan indikator Pilar Pembangunan Lingkungan, tingkat provinsi
deskripsi: >-
  Satu nilai pilihan per konsep, wilayah provinsi, periode, dan rincian untuk tujuan 6, 11, 12, 13, 14, 15, dipilih
  as-of tanggal acuan menurut aturan nilai pilihan praregistrasi M3 Bagian 5, hanya dari sumber kelas
  lisensi A atau A-SA. Alasan pilihan dan rilis asal ikut tersaji.
pilar: lingkungan
tujuan: [6, 11, 12, 13, 14, 15]
tingkat: provinsi
pemilik:
  peran: steward domain Pilar Pembangunan Lingkungan
  nama: Ardika Satria
  catatan: simulasi pemilik domain (brief 4 Bagian 3.4 pilihan a) sampai keputusan pemilik domain diambil
kanal_masalah: "<pelacak isu repositori penelitian>"
lisensi_keluaran: mengikuti lisensi sumber per baris (kolom sumber); kelas B dan C tidak dimuat
sla:
  kesegaran_hari: 400
  catatan: rilis terbaru di produk tidak lebih tua dari 400 hari terhadap tanggal acuan (BPS dan kustodian terbit tahunan)
kualitas:
  baris_minimum: 1
  wilayah_dalam_dim_wilayah: true
  satuan_dalam_dim_satuan: true
